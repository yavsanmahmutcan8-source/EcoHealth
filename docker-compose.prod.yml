version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecohealth_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecohealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecohealth_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecohealth_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - ecohealth_network

  redis:
    image: redis:7-alpine
    container_name: ecohealth_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    networks:
      - ecohealth_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecohealth_backend_prod
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ecohealth}:${POSTGRES_PASSWORD:-ecohealth_password}@db:5432/${POSTGRES_DB:-ecohealth_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
    networks:
      - ecohealth_network

  nginx:
    image: nginx:alpine
    container_name: ecohealth_nginx_prod
    restart: always
    ports:
      - "80:80"
      #- "443:443" # For SSL later
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro # This hooks up Developer B's compiled React code
    depends_on:
      - backend
    networks:
      - ecohealth_network

networks:
  ecohealth_network:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
