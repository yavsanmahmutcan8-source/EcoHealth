version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: ecohealth_db
    restart: always
    environment:
      POSTGRES_USER: ecohealth
      POSTGRES_PASSWORD: ecohealth_password
      POSTGRES_DB: ecohealth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecohealth_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
