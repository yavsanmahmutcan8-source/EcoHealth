worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name 52.58.30.77.nip.io;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name 52.58.30.77.nip.io;

        ssl_certificate /etc/letsencrypt/live/52.58.30.77.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/52.58.30.77.nip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Static files mapping (Frontend will be mounted here eventually)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Reverse Proxy for FastAPI
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
